---
layout: default
---
<article class="blog reading">
  <a class="post-back" href="{{ '/blog/' | relative_url }}">← All posts</a>
  <header class="post-header">
    <p class="date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="post-description">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
